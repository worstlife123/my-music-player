name: Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать / обновить релиз в GitHub Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set a unique release version
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          python tools/prepare_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release version preparation failed' }

      - name: Install Python and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip -r .github/windows-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Python dependencies' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Incompatible Python dependencies' }
          if (Test-Path "tools/generate_app_icon.py") {
            python tools/generate_app_icon.py
            if ($LASTEXITCODE -ne 0) { throw 'Failed to generate application icon' }
          }

      - name: Test source on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }

      - name: Build standalone portable folder player
        shell: pwsh
        run: |
          $argsList = @(
            "-m", "PyInstaller",
            "--noconfirm",
            "--clean",
            "--onedir",
            "--windowed",
            "--name", "AuroraMusicPlayer",
            "--distpath", "dist",
            "--workpath", "build",
            "--specpath", ".",
            "--collect-all", "yt_dlp",
            "--collect-all", "ytmusicapi",
            "--hidden-import", "requests",
            "--hidden-import", "certifi"
          )
          if (Test-Path "assets/aurora.ico") {
            $iconPath = (Resolve-Path "assets/aurora.ico").Path
            $argsList += @("--icon", $iconPath)
          }
          if (Test-Path "assets") {
            $assetsPath = (Resolve-Path "assets").Path
            $argsList += @("--add-data", "${assetsPath};assets")
          }
          if (Test-Path "fonts") {
            $fontsPath = (Resolve-Path "fonts").Path
            $argsList += @("--add-data", "${fontsPath};fonts")
          }
          $argsList += "player_aurora_smart_beautiful_fixed_ui_repaint.py"
          python @argsList
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller portable folder build failed' }
          if (-not (Test-Path "dist/AuroraMusicPlayer/AuroraMusicPlayer.exe")) {
            throw 'dist/AuroraMusicPlayer/AuroraMusicPlayer.exe was not produced'
          }

      - name: Test frozen Qt, mini-player and audio decoding
        shell: pwsh
        run: |
          $player = Start-Process -FilePath .\dist\AuroraMusicPlayer\AuroraMusicPlayer.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $player.WaitForExit(60000)) {
            Stop-Process -Id $player.Id -Force
            throw 'Frozen player smoke test timed out'
          }
          if ($player.ExitCode -ne 0) { throw "Frozen player smoke test failed: $($player.ExitCode)" }

      - name: Package portable folder and calculate checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\AuroraMusicPlayer -DestinationPath .\dist\AuroraMusicPlayer-windows-x64.zip -Force
          $checksum = (Get-FileHash .\dist\AuroraMusicPlayer-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$checksum  AuroraMusicPlayer-windows-x64.zip" | Set-Content .\dist\AuroraMusicPlayer-windows-x64.zip.sha256.txt -Encoding ascii

      - name: Build single-file standalone EXE
        shell: pwsh
        run: |
          $argsList = @(
            "-m", "PyInstaller",
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "AuroraMusicPlayer",
            "--distpath", "dist",
            "--workpath", "build_single",
            "--specpath", ".",
            "--collect-all", "yt_dlp",
            "--collect-all", "ytmusicapi",
            "--hidden-import", "requests",
            "--hidden-import", "certifi"
          )
          if (Test-Path "assets/aurora.ico") {
            $iconPath = (Resolve-Path "assets/aurora.ico").Path
            $argsList += @("--icon", $iconPath)
          }
          if (Test-Path "assets") {
            $assetsPath = (Resolve-Path "assets").Path
            $argsList += @("--add-data", "${assetsPath};assets")
          }
          if (Test-Path "fonts") {
            $fontsPath = (Resolve-Path "fonts").Path
            $argsList += @("--add-data", "${fontsPath};fonts")
          }
          $argsList += "player_aurora_smart_beautiful_fixed_ui_repaint.py"
          python @argsList
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller single-file EXE build failed' }
          if (-not (Test-Path .\dist\AuroraMusicPlayer.exe)) {
            throw 'Single-file AuroraMusicPlayer.exe was not produced'
          }
          $player = Start-Process -FilePath .\dist\AuroraMusicPlayer.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $player.WaitForExit(60000)) {
            Stop-Process -Id $player.Id -Force
            throw 'Single-file player smoke test timed out'
          }
          if ($player.ExitCode -ne 0) { throw "Single-file smoke test failed: $($player.ExitCode)" }
          $exeHash = (Get-FileHash .\dist\AuroraMusicPlayer.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  AuroraMusicPlayer.exe" | Set-Content .\dist\AuroraMusicPlayer.exe.sha256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraMusicPlayer-windows-x64
          path: |
            dist/AuroraMusicPlayer.exe
            dist/AuroraMusicPlayer.exe.sha256.txt
            dist/AuroraMusicPlayer-windows-x64.zip
            dist/AuroraMusicPlayer-windows-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AuroraMusicPlayer-windows-x64
          path: dist
      - name: Publish tested Windows EXE and portable ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="v${APP_VERSION#v}"
          ASSETS=(
            dist/AuroraMusicPlayer.exe
            dist/AuroraMusicPlayer.exe.sha256.txt
            dist/AuroraMusicPlayer-windows-x64.zip
            dist/AuroraMusicPlayer-windows-x64.zip.sha256.txt
          )
          (cd dist && sha256sum --check AuroraMusicPlayer.exe.sha256.txt AuroraMusicPlayer-windows-x64.zip.sha256.txt)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Release $TAG_NAME is already published; its files are unchanged."
              exit 0
            fi
          else
            gh release create "$TAG_NAME" --draft --target "$GITHUB_SHA" --generate-notes --title "Aurora Music Player $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          gh release edit "$TAG_NAME" --draft=false --latest
