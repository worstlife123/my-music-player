name: Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать / обновить релиз в GitHub Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: build_exe.bat
      - name: Read APP_VERSION from source
        id: version
        shell: pwsh
        run: |
          $ver = python -c "import re, pathlib; m = re.search(r'APP_VERSION\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]', pathlib.Path('player_aurora_smart_beautiful_fixed_ui_repaint.py').read_text(encoding='utf-8')); print(m.group(1) if m else '0.2.0')"
          $ver = $ver.Trim()
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Detected APP_VERSION: $ver"
      - name: Build standalone portable folder player
        shell: cmd
        run: call build_exe.bat
      - name: Test source on Windows
        shell: pwsh
        run: |
          & .\.build-venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Test frozen Qt, mini-player and audio decoding
        shell: pwsh
        run: |
          $player = Start-Process -FilePath .\dist\AuroraMusicPlayer\AuroraMusicPlayer.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $player.WaitForExit(60000)) {
            Stop-Process -Id $player.Id -Force
            throw 'Frozen player smoke test timed out'
          }
          if ($player.ExitCode -ne 0) { throw "Frozen player smoke test failed: $($player.ExitCode)" }
      - name: Package portable folder and calculate checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\AuroraMusicPlayer -DestinationPath .\dist\AuroraMusicPlayer-windows-x64.zip -Force
          $checksum = (Get-FileHash .\dist\AuroraMusicPlayer-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$checksum  AuroraMusicPlayer-windows-x64.zip" | Set-Content .\dist\AuroraMusicPlayer-windows-x64.zip.sha256.txt -Encoding ascii
      - name: Build single-file standalone EXE
        env:
          SKIP_PIP_INSTALL: '1'
        shell: cmd
        run: call build_exe.bat single
      - name: Calculate single-file EXE checksum
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\AuroraMusicPlayer.exe)) { throw 'Single-file AuroraMusicPlayer.exe was not produced' }
          $exeHash = (Get-FileHash .\dist\AuroraMusicPlayer.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  AuroraMusicPlayer.exe" | Set-Content .\dist\AuroraMusicPlayer.exe.sha256.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraMusicPlayer-windows-x64
          path: |
            dist/AuroraMusicPlayer.exe
            dist/AuroraMusicPlayer.exe.sha256.txt
            dist/AuroraMusicPlayer-windows-x64.zip
            dist/AuroraMusicPlayer-windows-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AuroraMusicPlayer-windows-x64
          path: dist
      - name: Publish tested Windows EXE and portable ZIP to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="v${APP_VERSION#v}"
          fi
          echo "Publishing release for tag: $TAG_NAME"
          ASSETS=(
            dist/AuroraMusicPlayer.exe
            dist/AuroraMusicPlayer.exe.sha256.txt
            dist/AuroraMusicPlayer-windows-x64.zip
            dist/AuroraMusicPlayer-windows-x64.zip.sha256.txt
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" --target "$GITHUB_SHA" --generate-notes --title "Aurora Music Player $TAG_NAME"
          fi


